<!doctype html><html><head><meta charset="utf-8"><title>contrastcap</title><style>
:root{--bg:#0C0C0D;--fg:#F2F2F0;--mute:#8C8C90;--rule:#2C2C30;--accent:#30D158}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{width:1200px;height:630px;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
#card{position:relative;width:1200px;height:630px;padding:56px 64px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr auto;column-gap:24px}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-bottom:18px;border-bottom:1px solid var(--rule)}
.top b{color:var(--fg);font-weight:500}
.hero{grid-column:1/11;align-self:center}
h1{font-size:188px;font-weight:700;letter-spacing:-.055em;line-height:.86;margin-left:-8px}
h1 i{font-style:normal;color:var(--accent)}
.tag{margin-top:30px;font-size:30px;line-height:1.25;font-weight:400;max-width:820px;color:#CFCFCC;letter-spacing:-.01em}
.top{position:relative}.top::after{content:"";position:absolute;left:0;bottom:-2px;width:288px;height:4px;background:var(--accent)}
@media (max-width:1100px){html{zoom:.8933}}
.grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);column-gap:24px;border-top:1px solid var(--rule);padding-top:18px}
.cell .n{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.cell .k{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:6px}
.cell .v{font-size:23px;font-weight:500;margin-top:6px;letter-spacing:-.01em}
</style></head><body><div id="card">
<div class="top"><span><b>@icjia/contrastcap</b></span><span>ICJIA · Open source · MIT</span></div>
<div class="hero"><h1>contrastcap<i>.</i></h1><p class="tag">WCAG contrast audits that settle axe-core’s “needs review” items by sampling rendered pixels.</p></div>
<div class="grid"><div class="cell"><div class="n">01</div><div class="k">Method</div><div class="v">Pixel sampling</div></div><div class="cell"><div class="n">02</div><div class="k">Levels</div><div class="v">AA 4.5:1 · AAA 7:1</div></div><div class="cell"><div class="n">03</div><div class="k">Fixes</div><div class="v">Hex color suggestions</div></div><div class="cell"><div class="n">04</div><div class="k">Runs as</div><div class="v">MCP server · CLI</div></div></div>
</div></body></html>
